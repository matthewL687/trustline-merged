services:
  - type: web
    name: trustline
    runtime: docker
    # Free web services cannot mount a disk, so there is no `disk:` block here
    # and /var/data lives in the container: the lookup and model-response cache
    # is lost on every restart. For a persistent cache, switch to `starter` and
    # add back a disk of 1GB at /var/data.
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TRUSTMAP_ALLOW_LOCAL_SCAN
        value: "0"
      - key: TRUSTMAP_TRUSTED_PROXY_HOPS
        value: "1"
      - key: TRUSTMAP_DAILY_CAP_USD
        value: "10"
      - key: TRUSTMAP_IP_SCANS_PER_HOUR
        value: "20"
      - key: TRUSTMAP_CACHE_DB
        value: /var/data/trustmap.db
